<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b12">
<title>Gold Fx · Sign in</title>
<link rel="icon" type="image/jpeg" href="/static/logo-icon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12;--panel:#0c111b;--card:#121a26;--input:#0e1520;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.22);
  --text:#f1f5f9;--muted:#94a3b8;--faint:#64748b;
  --gold:#fbbf24;--orange:#f97316;--cyan:#22d3ee;--green:#34d399;--red:#f87171;
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(251,191,36,.07),transparent),
    linear-gradient(180deg,#070b12 0%,#0a1018 100%);
}
button,input{font:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--cyan);text-decoration:none}
.hidden{display:none!important}

/* loader */
#pageLoader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060a11;transition:opacity .35s,visibility .35s}
#pageLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
#pageLoader .pl-logo{width:72px;height:72px;border-radius:18px;object-fit:cover;box-shadow:0 0 0 1px rgba(251,191,36,.25),0 12px 40px rgba(0,0,0,.45);animation:plPulse 1.2s ease-in-out infinite}
#pageLoader .pl-name{margin-top:14px;font-weight:800;font-size:18px;letter-spacing:-.03em}
#pageLoader .pl-name .g{color:#fbbf24}#pageLoader .pl-name .x{color:#22d3ee}
#pageLoader .pl-bar{width:120px;height:3px;border-radius:99px;background:rgba(148,163,184,.15);margin-top:16px;overflow:hidden}
#pageLoader .pl-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#22d3ee);animation:plSlide 1s ease-in-out infinite}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes plSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand img{width:32px;height:32px;border-radius:9px}
.brand .fx{color:var(--gold)}.brand .x{color:var(--cyan)}
.secure{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green);
  background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);padding:6px 10px;border-radius:99px}
.secure svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* card */
.wrap{max-width:420px;margin:0 auto;padding:8px 18px 40px}
.card{
  background:rgba(12,17,27,.92);border:1px solid var(--line);border-radius:20px;
  padding:28px 22px 24px;backdrop-filter:blur(12px);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.user-ico{
  width:56px;height:56px;margin:0 auto 16px;border-radius:14px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);
  display:grid;place-items:center;
}
.user-ico svg{width:28px;height:28px;stroke:#22d3ee;fill:none;stroke-width:1.8;stroke-linecap:round}
h1{text-align:center;font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:22px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--input);padding:4px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:11px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);transition:.15s}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04)}

/* google btn style (UI only) */
.btn-google{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--line2);
  background:var(--card);font-weight:600;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;
  color:var(--text);
}
.btn-google .g-ico{
  width:20px;height:20px;border-radius:50%;background:#fff;color:#4285F4;
  display:grid;place-items:center;font-weight:800;font-size:12px;font-family:Arial,sans-serif;
}
.btn-google:active{opacity:.85}

.divider{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--faint);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.input-wrap{position:relative}
.input-wrap .ico{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:1.8;pointer-events:none;
}
.input-wrap input{
  width:100%;padding:13px 42px 13px 40px;border-radius:12px;
  border:1px solid var(--line);background:var(--input);color:var(--text);outline:none;
  transition:border .15s;
}
.input-wrap input:focus{border-color:rgba(251,191,36,.45)}
.input-wrap input::placeholder{color:var(--faint)}
.eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;display:grid;place-items:center;color:var(--faint);border-radius:8px;
}
.eye:active{background:rgba(255,255,255,.04)}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

.row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:12px}
.remember{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;user-select:none}
.remember input{accent-color:var(--gold);width:15px;height:15px}
.forgot{color:var(--cyan);font-weight:600}

.btn-main{
  width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,#fb923c,#f97316);color:#fff;
  box-shadow:0 8px 24px rgba(249,115,22,.28);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s,filter .15s;
}
.btn-main:active{transform:scale(.98)}
.btn-main:disabled{opacity:.65;cursor:wait}
.btn-main .arrow{font-size:16px}

.err{color:var(--red);font-size:12px;min-height:18px;margin:-6px 0 10px;text-align:center}
.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--faint)}
.foot a{color:var(--gold);font-weight:700}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;background:#122018;border:1px solid rgba(52,211,153,.4);color:var(--green);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;max-width:90%}
.toast.err{background:#1a1214;border-color:rgba(248,113,113,.4);color:var(--red)}
</style>
</head>
<body>
<div id="pageLoader" aria-busy="true">
  <img class="pl-logo" src="/static/logo-icon.jpg" alt="Gold Fx" width="72" height="72">
  <div class="pl-name">Gold<span class="g">F</span><span class="x">x</span></div>
  <div class="pl-bar"><i></i></div>
</div>

<header class="topbar">
  <div class="brand">
    <img src="/static/logo-icon.jpg" alt="">
    Gold<span class="fx">F</span><span class="x">x</span>
  </div>
  <div class="secure">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Secure access
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="user-ico">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to your private market workspace.</p>

    <div class="tabs">
      <button type="button" class="on" id="tabIn" onclick="switchTab('in')">Sign in</button>
      <button type="button" id="tabReg" onclick="switchTab('reg')">Register</button>
    </div>

    <button type="button" class="btn-google" onclick="toast('Google login — នឹងភ្ជាប់ពេល setup OAuth', true)">
      <span class="g-ico">G</span> Continue with Google
    </button>

    <div class="divider">or use email</div>

    <!-- SIGN IN -->
    <div id="formIn">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
          <input id="inEmail" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="inPass" type="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="eye" onclick="toggleEye('inPass',this)" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> Remember email</label>
        <a class="forgot" href="#" onclick="toast('ទាក់ទង Admin ដើម្បី reset',true);return false">Forgot password?</a>
      </div>
      <div class="err" id="errIn"></div>
      <button type="button" class="btn-main" id="btnIn" onclick="doLogin()">Sign in <span class="arrow">→</span></button>
    </div>

    <!-- REGISTER -->
    <div id="formReg" class="hidden">
      <div class="field">
        <label>Name</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="regName" type="text" placeholder="Your name" autocomplete="name">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
          <input id="regEmail" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="regPass" type="password" placeholder="Min 6 characters" autocomplete="new-password">
          <button type="button" class="eye" onclick="toggleEye('regPass',this)" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="errReg"></div>
      <button type="button" class="btn-main" id="btnReg" onclick="doRegister()">Create account <span class="arrow">→</span></button>
    </div>
  </div>
  <p class="foot">Gold Fx · private trading workspace</p>
</div>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
  function hideLoader(){
    var el=document.getElementById('pageLoader');
    if(!el) return;
    el.classList.add('hide');
    setTimeout(function(){ el.remove(); }, 400);
  }
  if(document.readyState==='complete') setTimeout(hideLoader, 400);
  else window.addEventListener('load', function(){ setTimeout(hideLoader, 350); });
  setTimeout(hideLoader, 4000);
})();

async function api(path, opt={}){
  const r = await fetch('/api/'+path, {
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    ...opt
  });
  return r.json().catch(()=>({ok:false,error:'network'}));
}
function toast(m, err){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.toggle('err',!!err); t.classList.remove('hidden');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.add('hidden'), 2800);
}
function switchTab(mode){
  const isIn = mode==='in';
  document.getElementById('tabIn').classList.toggle('on', isIn);
  document.getElementById('tabReg').classList.toggle('on', !isIn);
  document.getElementById('formIn').classList.toggle('hidden', !isIn);
  document.getElementById('formReg').classList.toggle('hidden', isIn);
  document.getElementById('title').textContent = isIn ? 'Welcome back' : 'Create account';
  document.getElementById('subtitle').textContent = isIn
    ? 'Sign in to your private market workspace.'
    : 'Join Gold Fx — chart, levels & smart alerts.';
}
function toggleEye(id, btn){
  const inp=document.getElementById(id);
  const show = inp.type==='password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
async function doLogin(){
  const email=(document.getElementById('inEmail').value||'').trim().toLowerCase();
  const password=document.getElementById('inPass').value||'';
  const err=document.getElementById('errIn');
  const btn=document.getElementById('btnIn');
  if(!email||!password){ err.textContent='បំពេញ email និង password'; return; }
  btn.disabled=true;
  const r=await api('login',{method:'POST',body:JSON.stringify({email,password})});
  if(!r.ok){ err.textContent=r.error||'Login failed'; btn.disabled=false; return; }
  if(document.getElementById('remember').checked) localStorage.setItem('goldfx_email', email);
  else localStorage.removeItem('goldfx_email');
  location.href='/dashboard';
}
async function doRegister(){
  const name=(document.getElementById('regName').value||'').trim();
  const email=(document.getElementById('regEmail').value||'').trim().toLowerCase();
  const password=document.getElementById('regPass').value||'';
  const err=document.getElementById('errReg');
  const btn=document.getElementById('btnReg');
  if(!name||!email||password.length<6){ err.textContent='Name · email · password ≥ 6'; return; }
  btn.disabled=true;
  const r=await api('register',{method:'POST',body:JSON.stringify({name,email,password})});
  if(!r.ok){ err.textContent=r.error||'Failed'; btn.disabled=false; return; }
  location.href='/dashboard';
}
document.getElementById('inPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('regPass').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});

const saved=localStorage.getItem('goldfx_email');
if(saved){ document.getElementById('inEmail').value=saved; document.getElementById('remember').checked=true; }

// ?tab=reg
if(new URLSearchParams(location.search).get('tab')==='reg') switchTab('reg');

api('me').then(r=>{ if(r.user) location.href='/dashboard'; });
</script>
</body>
</html>
