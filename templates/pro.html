<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Fx · Pro</title>
<link rel="icon" type="image/jpeg" href="/static/logo-icon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a11;--panel:#0c121c;--card:#121a28;--line:rgba(148,163,184,.12);--text:#eef2f7;--muted:#8b9cb3;--gold:#fbbf24;--cyan:#22d3ee;--red:#f87171;--green:#34d399;--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:none;background:none;color:inherit}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.wrap{max-width:420px;margin:0 auto;padding:20px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.top img{width:36px;height:36px;border-radius:10px}
.top a{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
h1{font-size:20px;font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:16px}
ul{color:var(--muted);font-size:12px;line-height:1.9;margin:0 0 16px 18px}
.btn-gold{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200;font-weight:800;margin-top:8px}
.btn-ghost{width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;margin-top:8px}
.qr-box{background:#fff;border-radius:14px;padding:16px;text-align:center;margin:12px 0}
.qr-box img{width:180px;height:180px}
.amt{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--gold);margin:8px 0}
.hidden{display:none!important}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#122018;border:1px solid rgba(52,211,153,.4);color:var(--green);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20}
.toast.err{background:#1a1214;border-color:rgba(248,113,113,.4);color:var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}

/* Page loader */
#pageLoader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#060a11;transition:opacity .35s ease,visibility .35s}
#pageLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
#pageLoader .pl-logo{width:72px;height:72px;border-radius:18px;object-fit:cover;
  box-shadow:0 0 0 1px rgba(251,191,36,.25),0 12px 40px rgba(0,0,0,.45);
  animation:plPulse 1.2s ease-in-out infinite}
#pageLoader .pl-name{margin-top:14px;font-weight:800;font-size:18px;letter-spacing:-.03em;color:#eef2f7}
#pageLoader .pl-name .g{color:#fbbf24}#pageLoader .pl-name .x{color:#22d3ee}
#pageLoader .pl-bar{width:120px;height:3px;border-radius:99px;background:rgba(148,163,184,.15);margin-top:16px;overflow:hidden}
#pageLoader .pl-bar i{display:block;height:100%;width:40%;border-radius:99px;
  background:linear-gradient(90deg,#fbbf24,#22d3ee);animation:plSlide 1s ease-in-out infinite}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes plSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
</style>
</head>
<body>

<div id="pageLoader" aria-busy="true" aria-label="Loading">
  <img class="pl-logo" src="/static/logo-icon.jpg" alt="Gold Fx" width="72" height="72">
  <div class="pl-name">Gold<span class="g">F</span><span class="x">x</span></div>
  <div class="pl-bar"><i></i></div>
</div>

<div class="wrap">
  <div class="top">
    <img src="/static/logo-icon.jpg" alt="">
    <b>Gold Fx Pro</b>
    <a href="/dashboard">← Dashboard</a>
  </div>
  <div class="card" id="box">
    <h1>Unlock Pro</h1>
    <p class="sub">Live alerts · license key · priority signals</p>
    <ul>
      <li>Browser push + priority signals</li>
      <li>Pro badge · personal license key</li>
      <li>Price: <b style="color:var(--gold)" id="price">$9.99</b></li>
    </ul>
    <button class="btn-gold" type="button" onclick="buy()">បង់ប្រាក់ KHQR</button>
    <button class="btn-ghost" type="button" onclick="showKey()">មាន key រួច · បញ្ចូល</button>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<script>
let ORDER=null, poll=null, PRICE=9.99;
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opt});
  return r.json().catch(()=>({ok:false}));
}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.classList.toggle('err',!!e);t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

api('me').then(r=>{
  if(!r.user) location.href='/login';
  else if(r.user.pro){
    document.getElementById('box').innerHTML=`<h1>★ Pro Active</h1><p class="sub">Key: <b class="mono">${esc(r.user.key)}</b></p>
      <a class="btn-gold" href="/dashboard" style="display:block;text-align:center;text-decoration:none">ទៅ Dashboard</a>`;
  }
});

async function buy(){
  const box=document.getElementById('box');
  box.innerHTML='<p class="sub" style="text-align:center;padding:30px">កំពុងបង្កើត QR...</p>';
  const r=await api('pro/buy',{method:'POST',body:'{}'});
  if(!r.ok){
    box.innerHTML=`<h1>Pro</h1><p class="sub" style="color:var(--red)">${esc(r.error)}</p>
      <button class="btn-ghost" onclick="location.reload()">ព្យាយាមម្តងទៀត</button>`;
    return;
  }
  ORDER=r.order;
  const qr=(r.payment||{}).PAYMENT_QR||'';
  const err=r.ks_error||'';
  box.innerHTML=`
    <h1>ស្កេន KHQR</h1>
    <p class="sub">បង់រួច auto activate · ឬចុច «ខ្ញុំបានបង់»</p>
    <div class="qr-box">
      ${qr?`<img src="${esc(qr)}" alt="QR">`:`<div style="color:#f87171;padding:12px">❌ គ្មាន QR<br><span style="color:#64748b;font-size:12px">${esc(err)}</span></div>`}
      <div class="amt">$${Number(r.order.price||PRICE).toFixed(2)}</div>
      <div style="font-size:11px;color:#64748b">Order: <b>${esc(r.order.id)}</b></div>
    </div>
    <div id="st" style="font-size:12px;color:var(--muted);margin:8px 0">រង់ចាំបង់ប្រាក់...</div>
    <button class="btn-gold" id="btnPaid" onclick="confirmPaid()">ខ្ញុំបានបង់ហើយ</button>
    <button class="btn-ghost" onclick="location.href='/dashboard'">ត្រឡប់</button>`;
  if(qr) startPoll(r.order.id);
}
function startPoll(id){
  if(poll) clearInterval(poll);
  let n=0;
  poll=setInterval(async()=>{
    n++; if(n>90){clearInterval(poll);return}
    const r=await api('pro/check',{method:'POST',body:JSON.stringify({order_id:id})});
    const st=document.getElementById('st');
    if(st) st.textContent='ស្ថានភាព: '+(r.payment_status||'...');
    if(r.payment_status==='completed'||r.order?.status==='paid'){
      clearInterval(poll); toast('Pro activated ✓'); location.href='/dashboard';
    }
  },4000);
}
async function confirmPaid(){
  if(!ORDER) return;
  const btn=document.getElementById('btnPaid');
  if(btn){btn.disabled=true;btn.textContent='កំពុងផ្ទៀងផ្ទាត់...'}
  const r=await api('pro/confirm-paid',{method:'POST',body:JSON.stringify({order_id:ORDER.id})});
  if(r.user?.pro){toast('Pro activated'); location.href='/dashboard'; return}
  toast(r.message||r.error||'រង់ចាំ Admin', !r.ok);
  if(btn){btn.disabled=false;btn.textContent='ខ្ញុំបានបង់ហើយ'}
}
function showKey(){
  document.getElementById('box').innerHTML=`
    <h1>License key</h1>
    <div class="field"><label>Key</label><input id="k" placeholder="GF-XXXX-XXXX-XXXX" style="font-family:var(--mono)"></div>
    <button class="btn-gold" onclick="actKey()">Activate</button>
    <button class="btn-ghost" onclick="location.reload()">ត្រឡប់</button>`;
}
async function actKey(){
  const k=document.getElementById('k').value.trim();
  if(!k){toast('បញ្ចូល key',true);return}
  const r=await api('pro/activate-key',{method:'POST',body:JSON.stringify({key:k})});
  if(!r.ok){toast(r.error||'Fail',true);return}
  toast('Pro activated'); location.href='/dashboard';
}
</script>
<script>
(function(){
  function hideLoader(){
    var el=document.getElementById('pageLoader');
    if(!el) return;
    el.classList.add('hide');
    setTimeout(function(){ el.remove(); }, 400);
  }
  if(document.readyState==='complete') setTimeout(hideLoader, 400);
  else window.addEventListener('load', function(){ setTimeout(hideLoader, 350); });
  // safety
  setTimeout(hideLoader, 4000);
})();


document.addEventListener('click', function(e){
  var a = e.target.closest('a[href]');
  if(!a) return;
  var href = a.getAttribute('href')||'';
  if(href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:') || a.target==='_blank') return;
  if(href.startsWith('/') || !href.includes(':')){
    var el=document.getElementById('pageLoader');
    if(!el){
      el=document.createElement('div');
      el.id='pageLoader';
      el.innerHTML='<img class="pl-logo" src="/static/logo-icon.jpg" alt="" width="72" height="72"><div class="pl-name">Gold<span class="g">F</span><span class="x">x</span></div><div class="pl-bar"><i></i></div>';
      document.body.appendChild(el);
    } else {
      el.classList.remove('hide');
    }
  }
});
</script>
</body>
</html>
