<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gold Fx · Pro</title>
<link rel="icon" type="image/jpeg" href="/static/logo-icon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a11;--panel:#0c121c;--card:#121a28;--elev:#182234;
  --line:rgba(148,163,184,.12);--text:#eef2f7;--muted:#8b9cb3;--faint:#5b6b82;
  --gold:#fbbf24;--cyan:#22d3ee;--red:#f87171;--green:#34d399;--orange:#fb923c;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;border:none;background:none;color:inherit}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
input:focus{border-color:rgba(251,191,36,.45)}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px calc(24px + var(--safe))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.top b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.top a{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 16px 48px rgba(0,0,0,.35)}
h1{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:16px}
ul.feat{list-style:none;margin:0 0 18px;display:flex;flex-direction:column;gap:8px}
ul.feat li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--text);font-weight:600}
ul.feat li .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(251,191,36,.12);color:var(--gold);flex-shrink:0;font-size:14px}
.price-row{display:flex;align-items:baseline;gap:8px;margin:4px 0 16px}
.price-row .amt{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--gold)}
.price-row .lbl{font-size:12px;color:var(--muted);font-weight:600}
.btn-gold{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200;font-weight:800;font-size:15px;margin-top:8px;transition:transform .1s,filter .15s}
.btn-gold:active{transform:scale(.98)}
.btn-gold:disabled{opacity:.55;cursor:wait}
.btn-ghost{width:100%;padding:13px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;margin-top:8px;color:var(--text)}
.btn-outline{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600;margin-top:8px;color:var(--muted)}
.hidden{display:none!important}

/* QR payment */
.qr-wrap{background:#fff;border-radius:18px;padding:18px;text-align:center;margin:14px 0 10px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.qr-wrap img{width:min(240px,72vw);height:min(240px,72vw);display:block;margin:0 auto}
.qr-err{padding:28px 16px;color:#f87171;font-size:14px;font-weight:700;line-height:1.5}
.qr-err small{display:block;margin-top:8px;color:#64748b;font-size:12px;font-weight:500}
.pay-amt{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--gold);margin:10px 0 4px}
.pay-meta{font-size:11px;color:var(--faint);margin-bottom:2px}
.pay-meta b{color:var(--muted);font-family:var(--mono)}

.status-box{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);margin:12px 0;font-size:13px;font-weight:700;color:var(--gold)}
.status-box.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--green)}
.status-box.wait{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.22);color:var(--cyan)}
.status-box .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.timer{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted)}
.timer span{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:8px;min-width:42px;text-align:center;color:var(--text)}
.timer.urgent span{border-color:rgba(248,113,113,.4);color:var(--red)}

.steps{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
.step{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:10px;color:var(--gold);flex-shrink:0}
.step.on{color:var(--text);font-weight:600}
.step.on .n{background:rgba(251,191,36,.2);border-color:rgba(251,191,36,.4)}
.step.done .n{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.4);color:var(--green)}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#122018;border:1px solid rgba(52,211,153,.4);color:var(--green);padding:11px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.toast.err{background:#1a1214;border-color:rgba(248,113,113,.4);color:var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
.badge-auto{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(52,211,153,.15);color:var(--green);margin-left:6px;vertical-align:middle}
.badge-auto i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease-in-out infinite}

#pageLoader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060a11;transition:opacity .35s ease,visibility .35s}
#pageLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
#pageLoader .pl-logo{width:72px;height:72px;border-radius:18px;object-fit:cover;box-shadow:0 0 0 1px rgba(251,191,36,.25),0 12px 40px rgba(0,0,0,.45);animation:plPulse 1.2s ease-in-out infinite}
#pageLoader .pl-name{margin-top:14px;font-weight:800;font-size:18px;letter-spacing:-.03em;color:#eef2f7}
#pageLoader .pl-name .g{color:#fbbf24}#pageLoader .pl-name .x{color:#22d3ee}
#pageLoader .pl-bar{width:120px;height:3px;border-radius:99px;background:rgba(148,163,184,.15);margin-top:16px;overflow:hidden}
#pageLoader .pl-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#22d3ee);animation:plSlide 1s ease-in-out infinite}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes plSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* Official KHQR card (Bakong NBC style) */
.khqr-card{
  width:min(280px,82vw);margin:0 auto;background:#fff;border-radius:14px;
  overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);
  font-family:'Inter',system-ui,sans-serif;color:#111;
}
.khqr-head{
  background:linear-gradient(135deg,#e11d2e 0%,#c01020 100%);
  padding:14px 16px 12px;position:relative;min-height:52px;
  display:flex;align-items:center;justify-content:space-between;
}
.khqr-head::after{
  content:'';position:absolute;right:0;top:0;width:0;height:0;
  border-style:solid;border-width:0 36px 36px 0;border-color:transparent #fff transparent transparent;
  opacity:.95;
}
.khqr-logo{display:flex;align-items:center;gap:8px;z-index:1}
.khqr-logo-mark{
  width:28px;height:28px;border-radius:6px;background:#fff;display:grid;place-items:center;
  font-weight:900;font-size:11px;color:#e11d2e;letter-spacing:-.04em;line-height:1;
}
.khqr-logo-text{color:#fff;font-weight:800;font-size:18px;letter-spacing:.02em}
.khqr-logo-text span{font-weight:600;opacity:.9;font-size:13px;margin-left:2px}
.khqr-body{padding:16px 18px 20px;text-align:center}
.khqr-merchant{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:4px;word-break:break-word}
.khqr-amount{font-size:22px;font-weight:800;color:#111;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.khqr-amount .cur{font-size:14px;font-weight:700;color:#666;margin-left:4px}
.khqr-dash{border:none;border-top:1.5px dashed #d1d5db;margin:14px 0 16px}
.khqr-qr-wrap{
  position:relative;display:inline-block;padding:8px;background:#fff;
  border-radius:8px;line-height:0;
}
.khqr-qr-wrap img{width:180px;height:180px;display:block;border-radius:4px}
.khqr-currency-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:36px;height:36px;border-radius:50%;background:#fff;
  border:2px solid #e11d2e;display:grid;place-items:center;
  font-weight:900;font-size:16px;color:#e11d2e;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.khqr-foot{margin-top:12px;font-size:10px;color:#9ca3af;font-weight:600;letter-spacing:.04em}
.khqr-err{padding:28px 16px;color:#e11d2e;font-size:13px;font-weight:700;line-height:1.5;text-align:center}
.khqr-err small{display:block;margin-top:8px;color:#6b7280;font-size:11px;font-weight:500}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="pageLoader" aria-busy="true" aria-label="Loading">
  <img class="pl-logo" src="/static/logo-icon.jpg" alt="Gold Fx" width="72" height="72">
  <div class="pl-name">Gold<span class="g">F</span><span class="x">x</span></div>
  <div class="pl-bar"><i></i></div>
</div>

<div class="wrap">
  <div class="top">
    <img src="/static/logo-icon.jpg" alt="">
    <b>Gold Fx Pro</b>
    <a href="/dashboard">← Dashboard</a>
  </div>
  <div class="card" id="box">
    <h1>Unlock Pro</h1>
    <p class="sub">Signals អាទិភាព · license key · browser alerts</p>
    <ul class="feat">
      <li><span class="ic">🔔</span> Browser push + priority signals</li>
      <li><span class="ic">★</span> Pro badge · personal license key</li>
      <li><span class="ic">⚡</span> Auto activate បន្ទាប់ពីបង់ KHQR</li>
    </ul>
    <div class="price-row">
      <span class="amt" id="price">$9.99</span>
      <span class="lbl">មួយដង · lifetime</span>
    </div>
    <button class="btn-gold" type="button" onclick="buy()">បង់ប្រាក់តាម KHQR (Bakong)</button>
    <button class="btn-ghost" type="button" onclick="showKey()">មាន key រួច · បញ្ចូល</button>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
let ORDER = null, poll = null, timerIv = null, PRICE = 9.99;
const EXPIRE_SEC = 10 * 60; // Khmer System QR ~10 min
let expireAt = 0;

async function api(path, opt = {}){
  const r = await fetch('/api/' + path, {
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    ...opt,
  });
  return r.json().catch(() => ({ok: false, error: 'network'}));
}
function toast(m, e){
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.toggle('err', !!e);
  t.classList.remove('hidden');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(() => t.classList.add('hidden'), 3000);
}
function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

api('config').then(c => {
  if(c && c.ok && c.pro_price){
    PRICE = Number(c.pro_price);
    const el = document.getElementById('price');
    if(el) el.textContent = '$' + PRICE.toFixed(2);
  }
}).catch(() => {});

api('me').then(r => {
  if(!r.user){ location.href = '/login'; return; }
  if(r.user.pro){
    document.getElementById('box').innerHTML = `
      <h1>★ Pro Active</h1>
      <p class="sub">អ្នកជា Pro រួចហើយ</p>
      <div style="font-family:var(--mono);font-size:13px;background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px;word-break:break-all">
        Key: <b>${esc(r.user.key || '—')}</b>
      </div>
      <a class="btn-gold" href="/dashboard" style="display:block;text-align:center;text-decoration:none">ទៅ Dashboard</a>`;
  }
});

async function buy(){
  const box = document.getElementById('box');
  box.innerHTML = `
    <h1>កំពុងបង្កើត QR</h1>
    <p class="sub" style="text-align:center;padding:28px 8px">ភ្ជាប់ Bakong · សូមរង់ចាំ…</p>`;
  const r = await api('pro/buy', {method: 'POST', body: '{}'});
  if(!r.ok){
    box.innerHTML = `
      <h1>មិនបានជោគជ័យ</h1>
      <p class="sub" style="color:var(--red)">${esc(r.error || 'បរាជ័យ')}</p>
      <button class="btn-gold" type="button" onclick="buy()">ព្យាយាមម្តងទៀត</button>
      <button class="btn-ghost" type="button" onclick="location.href='/dashboard'">ត្រឡប់</button>`;
    return;
  }
  ORDER = r.order;
  const qrStr = (r.khmer_system && r.khmer_system.qr_string)
    || (r.order && r.order.bakong_qr_string)
    || (r.payment && r.payment.QR_STRING)
    || '';
  const qr = (r.payment && r.payment.PAYMENT_QR)
    || (r.khmer_system && (r.khmer_system.qr_image_url || r.khmer_system.qr))
    || (r.order && r.order.payment_qr)
    || '';
  const err = r.ks_error || '';
  console.log('pro/buy', {ok:r.ok, hasQr:!!(qr||qrStr), qrStrLen:(qrStr||'').length, err});
  const amt = Number(r.order.price || PRICE).toFixed(2);
  expireAt = Date.now() + EXPIRE_SEC * 1000;

  box.innerHTML = `
    <h1>ស្កេន KHQR
      <span class="badge-auto"><i></i> AUTO</span>
    </h1>
    <p class="sub">បើក app ធនាគារ (ABA · ACLEDA · Wing …) រួចស្កេន · បង់រួច <b style="color:var(--green)">Pro បើកស្វ័យប្រវត្តិ</b></p>

    <div class="steps">
      <div class="step done"><span class="n">✓</span> បង្កើត order ${esc(r.order.id)}</div>
      <div class="step on" id="stepScan"><span class="n">2</span> ស្កេន QR និងបង់ $${amt}</div>
      <div class="step" id="stepAct"><span class="n">3</span> Auto activate Pro</div>
    </div>

    <div style="margin:14px 0 10px">
      <div class="khqr-card">
        <div class="khqr-head">
          <div class="khqr-logo">
            <div class="khqr-logo-mark">KH</div>
            <div class="khqr-logo-text">KHQR<span>Bakong</span></div>
          </div>
        </div>
        <div class="khqr-body">
          ${(qr||qrStr) ? `
            <div class="khqr-merchant">${esc((r.payment&&r.payment.MERCHANT)||(r.bakong&&r.bakong.merchant)||'Gold Fx')}</div>
            <div class="khqr-amount">${amt}<span class="cur">USD</span></div>
            <hr class="khqr-dash">
            <div class="khqr-qr-wrap">
              <div id="khqrBox" style="width:180px;height:180px;margin:0 auto"></div>
              <div class="khqr-currency-badge">$</div>
            </div>
            <div class="khqr-foot">SCAN WITH ANY BANKING APP</div>
          ` : `<div class="khqr-err">❌ មិនមាន QR<br><small>${esc(err||'Admin ត្រូវដាក់ Bakong Token + Bakong ID')}</small></div>`}
        </div>
      </div>
    </div>
    <div class="pay-meta" style="text-align:center;margin-top:8px">Order: <b>${esc(r.order.id)}</b> · Bakong KHQR</div>

    <div class="timer" id="timer"><span id="tm">10</span>:<span id="ts">00</span></div>

    <div class="status-box" id="stBox">
      <span class="dot"></span>
      <span id="st">រង់ចាំបង់ប្រាក់…</span>
    </div>

    <button class="btn-gold" type="button" id="btnPaid" onclick="confirmPaid()">ខ្ញុំបានបង់ហើយ</button>
    <button class="btn-outline" type="button" onclick="cancelPay()">បោះបង់</button>`;

  startTimer();
  // Render KHQR from full payload string (avoid truncated external image)
  const qrStr = (r.khmer_system && r.khmer_system.qr_string)
    || (r.order && r.order.bakong_qr_string)
    || (r.payment && r.payment.QR_STRING)
    || '';
  const boxEl = document.getElementById('khqrBox');
  if(boxEl && qrStr && typeof QRCode !== 'undefined'){
    boxEl.innerHTML = '';
    new QRCode(boxEl, {text: qrStr, width:180, height:180, correctLevel: QRCode.CorrectLevel.M});
  } else if(boxEl && qr){
    boxEl.innerHTML = '<img src="'+esc(qr)+'" width="180" height="180" alt="KHQR">';
  }
  if(qr || qrStr) startPoll(r.order.id);
  else {
    const st = document.getElementById('st');
    if(st) st.textContent = 'គ្មាន QR · ត្រូវ Admin ដាក់ KS key';
  }
}

function startTimer(){
  if(timerIv) clearInterval(timerIv);
  function tick(){
    const left = Math.max(0, Math.floor((expireAt - Date.now()) / 1000));
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const s = String(left % 60).padStart(2, '0');
    const tm = document.getElementById('tm');
    const ts = document.getElementById('ts');
    const timer = document.getElementById('timer');
    if(tm) tm.textContent = m;
    if(ts) ts.textContent = s;
    if(timer) timer.classList.toggle('urgent', left <= 60);
    if(left <= 0){
      clearInterval(timerIv);
      if(poll) clearInterval(poll);
      const st = document.getElementById('st');
      const box = document.getElementById('stBox');
      if(st) st.textContent = 'QR ផុតកំណត់ · សូមបង្កើតម្តងទៀត';
      if(box){ box.className = 'status-box'; box.style.color = 'var(--red)'; }
    }
  }
  tick();
  timerIv = setInterval(tick, 1000);
}

function startPoll(id){
  if(poll) clearInterval(poll);
  let n = 0;
  poll = setInterval(async () => {
    n++;
    if(n > 150){ clearInterval(poll); return; } // ~10 min at 4s
    const r = await api('pro/check', {method: 'POST', body: JSON.stringify({order_id: id})});
    const st = document.getElementById('st');
    const box = document.getElementById('stBox');
    const status = r.payment_status || r.order?.status || '...';
    if(st){
      if(status === 'pending' || status === 'pending_payment')
        st.textContent = 'រង់ចាំបង់ប្រាក់… ស្កេន QR ឥឡូវ';
      else if(status === 'waiting_confirm')
        st.textContent = 'រង់ចាំ Admin confirm…';
      else
        st.textContent = 'ស្ថានភាព: ' + status;
    }
    if(box){
      if(status === 'waiting_confirm') box.className = 'status-box wait';
      else box.className = 'status-box';
    }
    if(r.payment_status === 'completed' || r.order?.status === 'paid'){
      clearInterval(poll);
      if(timerIv) clearInterval(timerIv);
      if(st) st.textContent = 'បង់ជោគជ័យ · កំពុង activate Pro…';
      if(box) box.className = 'status-box ok';
      const s2 = document.getElementById('stepScan');
      const s3 = document.getElementById('stepAct');
      if(s2){ s2.className = 'step done'; s2.querySelector('.n').textContent = '✓'; }
      if(s3){ s3.className = 'step done'; s3.querySelector('.n').textContent = '✓'; }
      toast('Pro activated ✓');
      setTimeout(() => { location.href = '/dashboard'; }, 1200);
    }
  }, 4000);
}

async function confirmPaid(){
  if(!ORDER) return;
  const btn = document.getElementById('btnPaid');
  if(btn){ btn.disabled = true; btn.textContent = 'កំពុងផ្ទៀងផ្ទាត់…'; }
  const r = await api('pro/confirm-paid', {method: 'POST', body: JSON.stringify({order_id: ORDER.id})});
  if(r.user && r.user.pro){
    if(poll) clearInterval(poll);
    if(timerIv) clearInterval(timerIv);
    toast('Pro activated ✓');
    location.href = '/dashboard';
    return;
  }
  toast(r.message || r.error || 'រង់ចាំ Admin confirm', !r.ok);
  const st = document.getElementById('st');
  const box = document.getElementById('stBox');
  if(st) st.textContent = r.message || 'រង់ចាំ confirm…';
  if(box) box.className = 'status-box wait';
  if(btn){ btn.disabled = false; btn.textContent = 'ខ្ញុំបានបង់ហើយ'; }
}

function cancelPay(){
  if(poll) clearInterval(poll);
  if(timerIv) clearInterval(timerIv);
  location.href = '/dashboard';
}

function showKey(){
  document.getElementById('box').innerHTML = `
    <h1>License key</h1>
    <p class="sub">បញ្ចូល key ទម្រង់ GF-XXXX-XXXX-XXXX</p>
    <div class="field"><label>Key</label>
      <input id="k" placeholder="GF-XXXX-XXXX-XXXX" style="font-family:var(--mono)" autocomplete="off" autocapitalize="characters">
    </div>
    <button class="btn-gold" type="button" onclick="actKey()">Activate Pro</button>
    <button class="btn-ghost" type="button" onclick="location.reload()">ត្រឡប់</button>`;
  setTimeout(() => document.getElementById('k')?.focus(), 100);
}

async function actKey(){
  const k = (document.getElementById('k')?.value || '').trim();
  if(!k){ toast('បញ្ចូល key', true); return; }
  const r = await api('pro/activate-key', {method: 'POST', body: JSON.stringify({key: k})});
  if(!r.ok){ toast(r.error || 'Key មិនត្រឹមត្រូវ', true); return; }
  toast('Pro activated ✓');
  location.href = '/dashboard';
}
</script>
<script>
(function(){
  function hideLoader(){
    var el = document.getElementById('pageLoader');
    if(!el) return;
    el.classList.add('hide');
    setTimeout(function(){ el.remove(); }, 400);
  }
  if(document.readyState === 'complete') setTimeout(hideLoader, 350);
  else window.addEventListener('load', function(){ setTimeout(hideLoader, 300); });
  setTimeout(hideLoader, 4000);
})();
</script>
</body>
